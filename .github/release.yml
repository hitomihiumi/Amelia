changelog:
  exclude:
    - labels:
        - ignore-for-release
    - authors:
        - bot
  categories:
    - title: 'New Features'
      labels:
        - 'feature'
        - 'enhancement'
    - title: 'Bug Fixes'
      labels:
        - 'fix'
        - 'bug'
    - title: 'Maintenance'
      labels:
        - 'chore'
        - 'refactor'
        - 'maintenance'
    - title: 'Documentation'
      labels:
        - 'documentation'
        - 'docs'
    - title: 'Breaking Changes'
      labels:
        - 'breaking'
    - title: 'Other Changes'
      labels:
        - '*'

