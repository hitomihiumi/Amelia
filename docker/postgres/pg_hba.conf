# Used by docker-compose.remote.yml only (PostgreSQL reachable from another host, e.g. a dashboard on Vercel).
#
# Containers of the compose network (bot, migrate) reach the database over the private Docker network
# without TLS. Anything coming from another address must use TLS and a password. A connection from a
# public address without TLS is rejected before it can even try a password.
#
# Docker networks use private ranges; if your daemon hands out another range, add it below.
# local socket inside the container (healthcheck, docker exec)
local   all   all                    trust
# the compose network (bot, migrate): plain, private ranges only
host    all   all   10.0.0.0/8       scram-sha-256
host    all   all   172.16.0.0/12    scram-sha-256
host    all   all   192.168.0.0/16   scram-sha-256
# everything else (the internet, Vercel): TLS only
hostssl all   all   0.0.0.0/0        scram-sha-256
hostssl all   all   ::/0             scram-sha-256
host    all   all   0.0.0.0/0        reject
host    all   all   ::/0             reject
