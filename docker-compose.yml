services:
  migrate:
    image: ghcr.io/hitomihiumi/amelia:latest
    container_name: amelia_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-amelia}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "sleep 5 && npx prisma migrate deploy"
    networks:
      - amelia_network

  bot:
    image: ghcr.io/hitomihiumi/amelia:latest
    container_name: amelia_bot
    restart: always
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      # Mount assets if you want to customize them locally, otherwise the image has them.
      # - ./assets:/app/assets
      - ./logs:/app/logs
    networks:
      - amelia_network

  postgres:
    image: postgres:15-alpine
    container_name: amelia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-amelia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amelia_network

  redis:
    image: redis:7-alpine
    container_name: amelia_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amelia_network

volumes:
  postgres_data:
  redis_data:

networks:
  amelia_network:
    driver: bridge

