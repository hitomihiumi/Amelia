services:
  migrate:
    image: ghcr.io/hitomihiumi/amelia:latest
    container_name: amelia_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-amelia}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Waits for the database, backs it up to ./backups, applies the migrations and restores the backup
    # if one of them fails (the bot then does not start). Never resets the database.
    command: node scripts/db.mjs deploy --yes
    volumes:
      - ./backups:/app/backups
    networks:
      - amelia_network

  bot:
    image: ghcr.io/hitomihiumi/amelia:latest
    container_name: amelia_bot
    restart: always
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      # Mount assets if you want to customize them locally, otherwise the image has them.
      # - ./assets:/app/assets
      - ./logs:/app/logs
    networks:
      - amelia_network

  # Collects the warnings and errors of every container on this host into Redis for the dashboard's
  # admin panel (Logs page, last 24 hours). It only reads logs, but access to the Docker socket is
  # root-equivalent on the host: remove this service if you do not want the Logs page.
  logs:
    image: ghcr.io/hitomihiumi/amelia:latest
    container_name: amelia_logs
    restart: always
    env_file: .env
    command: node scripts/log-shipper.mjs
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - amelia_network

  postgres:
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    container_name: amelia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-amelia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Only this machine. To reach the database from another host (a dashboard on Vercel) use
      # docker-compose.remote.yml, which adds a TLS-only port.
      - "127.0.0.1:5632:5432"
    healthcheck:
      # -d is needed: without it pg_isready probes a database named like the user (FATAL: database "..." does not exist)
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-amelia}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amelia_network

  redis:
    image: redis:7-alpine
    container_name: amelia_redis
    restart: always
    environment:
      # Empty means no password. Set it as soon as Redis is reachable from outside the compose network,
      # and put it into REDIS_URL too: redis://:password@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amelia_network

volumes:
  postgres_data:
  redis_data:

networks:
  amelia_network:
    driver: bridge

