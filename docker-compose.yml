version: '3.8'

services:
  migrate:
    image: ghcr.io/hitomihiumi/amelia:latest
    container_name: amelia_migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://amelia_bot:3d4d20a30abacdc519408b2725376be0c7634b18@postgres:5432/amelia?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    command: sh -c "sleep 5 && npx prisma migrate deploy"
    networks:
      - amelia_network

  bot:
    image: ghcr.io/hitomihiumi/amelia:latest
    container_name: amelia_bot
    restart: always
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      mongodb:
        condition: service_started
    volumes:
      # Mount assets if you want to customize them locally, otherwise the image has them.
      # - ./assets:/app/assets
      - ./logs:/app/logs
    networks:
      - amelia_network

  postgres:
    image: postgres:15-alpine
    container_name: amelia_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-amelia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amelia_network

  mongodb:
    image: mongo:6
    container_name: amelia_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amelia_network

volumes:
  postgres_data:
  mongodb_data:

networks:
  amelia_network:
    driver: bridge

